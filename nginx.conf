server {
    listen 5060;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;
    gzip_min_length 1024;

    # CORS headers
    add_header Access-Control-Allow-Origin  "*"           always;
    add_header X-Frame-Options              "ALLOWALL"    always;
    add_header Content-Security-Policy      "frame-ancestors *" always;
    add_header X-Content-Type-Options       "nosniff"     always;

    # Flutter web — SPA routing (todas las rutas → index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache assets estáticos (imágenes, fuentes, iconos)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache JS/CSS con hash (Flutter genera nombres con hash)
    location ~* \.(js|css|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No cachear index.html (siempre actualizado)
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Logs
    access_log /var/log/nginx/aldrascan_access.log;
    error_log  /var/log/nginx/aldrascan_error.log;
}
